name: Release
# Pushing a tag like v0.2.0 builds, signs, notarizes and publishes Overhead-0.2.0.dmg.
# Required repository secrets (set them with scripts/setup-release-secrets.sh):
#   DEVELOPER_ID_P12_BASE64      base64 of a .p12 export of the "Developer ID Application" identity
#   DEVELOPER_ID_P12_PASSWORD    password protecting that .p12
#   APPLE_ID                     Apple ID email of the developer account
#   APPLE_TEAM_ID                10-character team identifier
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for notarytool
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build number is the commit count
      - name: Check that release secrets are configured
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$APPLE_ID" ]; then
            echo "::error::Release secrets are not set. Run scripts/setup-release-secrets.sh <DeveloperID.p12> locally, then re-run this workflow or push the tag again."
            exit 1
          fi
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Import Developer ID certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Developer ID Application" >/dev/null
      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: xcrun notarytool store-credentials overhead-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
      - name: Build, notarize and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh "${GITHUB_REF_NAME#v}" --publish
