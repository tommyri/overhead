name: Overhead
options:
  bundleIdPrefix: app
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  configs:
    Release:
      # Xcode injects the debugger entitlement (get-task-allow) into `build` actions by
      # default; notarization rejects binaries that carry it.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  base:
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  OverheadCore:
    path: OverheadCore
targets:
  Overhead:
    type: application
    platform: macOS
    sources:
      - path: Overhead
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: OverheadCore
      - target: overhead-statusline
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: Overhead/Resources/Info.plist
      properties:
        CFBundleName: Overhead
        CFBundleDisplayName: Overhead
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        LSUIElement: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Overhead/Resources/Overhead.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.overhead
        PRODUCT_NAME: Overhead
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
  overhead-statusline:
    type: tool
    platform: macOS
    sources:
      - path: OverheadStatusLine
    settings:
      base:
        PRODUCT_NAME: overhead-statusline
        PRODUCT_BUNDLE_IDENTIFIER: app.overhead.statusline
        SKIP_INSTALL: YES
schemes:
  Overhead:
    build:
      targets:
        Overhead: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: OverheadCore/OverheadCoreTests
