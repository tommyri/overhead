name: LLMOverview
options:
  bundleIdPrefix: app
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  configs:
    Release:
      # Xcode injects the debugger entitlement (get-task-allow) into `build` actions by
      # default; notarization rejects binaries that carry it.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  LLMOverviewCore:
    path: LLMOverviewCore
targets:
  LLMOverview:
    type: application
    platform: macOS
    sources:
      - path: LLMOverview
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: LLMOverviewCore
    info:
      path: LLMOverview/Resources/Info.plist
      properties:
        CFBundleName: LLM Overview
        CFBundleDisplayName: LLM Overview
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        LSUIElement: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: LLMOverview/Resources/LLMOverview.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.llmoverview
        PRODUCT_NAME: LLM Overview
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
schemes:
  LLMOverview:
    build:
      targets:
        LLMOverview: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: LLMOverviewCore/LLMOverviewCoreTests
